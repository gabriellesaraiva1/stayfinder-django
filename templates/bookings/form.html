{% extends "base.html" %}
{% block content %}<div class="form-shell"><h1 class="h2 fw-bold">Solicitar reserva</h1><p class="text-muted">{{ listing.title }} · R$ {{ listing.nightly_price }} por noite</p><form method="post" class="card card-body border-0 shadow-sm p-4">{% csrf_token %}{{ form.as_p }}{% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}<button class="btn btn-brand">Enviar solicitação</button></form></div>{% endblock %}
